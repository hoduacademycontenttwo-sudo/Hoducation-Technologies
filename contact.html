<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact &amp; Enterprise Demo Request | Hoducation Technologies</title>
    <meta
      name="description"
      content="Request a personalized demo and institutional pricing with Hoducation Technologies for AcadOS, Custom ERP, CRM, and Intelligent Automations."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hoducation.tech/contact" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hoducation.tech/contact" />
    <meta property="og:title" content="Contact &amp; Enterprise Demo Request | Hoducation Technologies" />
    <meta property="og:description" content="Request a live demo and institutional pricing from Hoducation Technologies." />
    <meta property="og:image" content="https://hoducation.tech/ht-logo.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/ht-logo.jpg" />

    <!-- Google Fonts Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6.5.2 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body style="margin: 0; background-color: #f8fafc;">
    <div id="contact-root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc;">
        <style>
          .contact-init-loader { width: 140px; max-height: 900px; transform-origin: 50% 50%; overflow: visible; }
          .contact-init-ci1 { fill: #800020; animation: toBig 3s infinite -1.5s; transform-box: fill-box; transform-origin: 50% 50%; }
          .contact-init-ciw { transform-box: fill-box; transform-origin: 50% 50%; animation: breath 3s infinite; }
          .contact-init-ci2 { fill: #800020; animation: toBig2 3s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
          .contact-init-points { animation: rot 3s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
          @keyframes rot { 0% { transform: rotate(0deg); } 30% { transform: rotate(360deg); } 50% { transform: rotate(360deg); } 80% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
          @keyframes toBig { 0% { transform: scale(1) translateX(0px); } 30% { transform: scale(1) translateX(0px); } 50% { transform: scale(10) translateX(-4.5px); } 80% { transform: scale(10) translateX(-4.5px); } 100% { transform: scale(1) translateX(0px); } }
          @keyframes toBig2 { 0% { transform: scale(1) translateX(0px); } 30% { transform: scale(1) translateX(0px); } 50% { transform: scale(10) translateX(4.5px); } 80% { transform: scale(10) translateX(4.5px); } 100% { transform: scale(1) translateX(0px); } }
          @keyframes breath { 15% { transform: scale(1); } 40% { transform: scale(1.1); } 65% { transform: scale(1); } 90% { transform: scale(1.1); } }
        </style>
        <svg viewBox="0 0 100 100" class="contact-init-loader">
          <g class="contact-init-points"> 
            <circle fill="#fff" r="50" cy="50" cx="50" class="contact-init-ciw"></circle>
            <circle r="4" cy="50" cx="5" class="contact-init-ci2"></circle>
            <circle r="4" cy="50" cx="95" class="contact-init-ci1"></circle>
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/contact.tsx"></script>
  </body>
</html>
