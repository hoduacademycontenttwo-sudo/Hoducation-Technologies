<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog &amp; Engineering Insights | Hoducation Technologies</title>
    <meta
      name="description"
      content="Explore in-depth technical guides, architectural breakdowns, and strategic playbooks on custom software development, AI automation, ERP systems, and modern digital infrastructure."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hoducation.tech/blog" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hoducation.tech/blog" />
    <meta property="og:title" content="Blog &amp; Engineering Insights | Hoducation Technologies" />
    <meta property="og:description" content="Explore expert software engineering, AI automation, and enterprise ERP guides by Hoducation Technologies." />
    <meta property="og:image" content="https://hoducation.tech/ht-logo.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blog &amp; Engineering Insights | Hoducation Technologies" />
    <meta name="twitter:description" content="Explore expert software engineering, AI automation, and enterprise ERP guides by Hoducation Technologies." />
    <meta name="twitter:image" content="https://hoducation.tech/ht-logo.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/ht-logo.jpg" />

    <!-- Google Fonts Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6.5.2 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/styles.css" />

    <!-- Structured Data for Blog Collection -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Hoducation Technologies Engineering Insights",
        "url": "https://hoducation.tech/blog",
        "description": "Guides and playbooks on custom software development, AI automation, ERP systems, and modern digital infrastructure.",
        "publisher": {
          "@type": "Organization",
          "name": "Hoducation Technologies Pvt Ltd",
          "logo": {
            "@type": "ImageObject",
            "url": "https://hoducation.tech/ht-logo.jpg"
          }
        }
      }
    </script>
  </head>
  <body style="margin: 0; background-color: #f3f2ee;">
    <div id="blog-root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f3f2ee;">
        <style>
          .initial-loader { width: 120px; max-height: 900px; transform-origin: 50% 50%; overflow: visible; }
          .initial-ci1 { fill: #800020; animation: initToBig 3s infinite -1.5s; transform-box: fill-box; transform-origin: 50% 50%; }
          .initial-ciw { transform-box: fill-box; transform-origin: 50% 50%; animation: initBreath 3s infinite; }
          .initial-ci2 { fill: #800020; animation: initToBig2 3s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
          .initial-points { animation: initRot 3s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
          @keyframes initRot { 0% { transform: rotate(0deg); } 30% { transform: rotate(360deg); } 50% { transform: rotate(360deg); } 80% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
          @keyframes initToBig { 0% { transform: scale(1) translateX(0px); } 30% { transform: scale(1) translateX(0px); } 50% { transform: scale(10) translateX(-4.5px); } 80% { transform: scale(10) translateX(-4.5px); } 100% { transform: scale(1) translateX(0px); } }
          @keyframes initToBig2 { 0% { transform: scale(1) translateX(0px); } 30% { transform: scale(1) translateX(0px); } 50% { transform: scale(10) translateX(4.5px); } 80% { transform: scale(10) translateX(4.5px); } 100% { transform: scale(1) translateX(0px); } }
          @keyframes initBreath { 15% { transform: scale(1); } 40% { transform: scale(1.1); } 65% { transform: scale(1); } 90% { transform: scale(1.1); } }
        </style>
        <svg viewBox="0 0 100 100" class="initial-loader">
          <g class="initial-points"> 
            <circle fill="#fff" r="50" cy="50" cx="50" class="initial-ciw"></circle>
            <circle r="4" cy="50" cx="5" class="initial-ci2"></circle>
            <circle r="4" cy="50" cx="95" class="initial-ci1"></circle>
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/blog.tsx"></script>
  </body>
</html>
